name: CI Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar análise estática
        run: ruff check .

      - name: Verificar formatação
        run: ruff format --check .

      - name: Executar testes e cobertura
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/junit.xml

      - name: Guardar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: error
          retention-days: 7

  container-smoke-test:
    name: Build e teste do container
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Construir a imagem
        run: docker build --tag devops-python-api:${{ github.sha }} .

      - name: Iniciar o container
        run: |
          docker run \
            --detach \
            --name devops-python-api \
            --publish 8000:8000 \
            devops-python-api:${{ github.sha }}

      - name: Verificar o endpoint de saúde
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            echo "Tentativa ${attempt}: API ainda não está pronta"
            sleep 1
          done
          exit 1

      - name: Mostrar logs do container
        if: always()
        run: docker logs devops-python-api

      - name: Remover o container
        if: always()
        run: docker rm --force devops-python-api

  deploy-to-ecr:
    name: Deploy para o Amazon ECR
    needs: [quality-and-tests, container-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: DES

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir, taguear e enviar a imagem para o ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: us-east-1
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG
          script: |
            # 5. Autenticar o Docker da instância no ECR
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
            
            # 6. Realizar o download da imagem correspondente ao commit
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            
            # 7. Substituir o contêiner anterior
            docker stop devops-python-api || true
            docker rm devops-python-api || true
            
            # 8. Iniciar a aplicação atualizada
            docker run --detach \
              --name devops-python-api \
              --publish 8000:8000 \
              --restart unless-stopped \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
              
            # 9. Verificar se o contêiner está em execução
            sleep 3
            if [ "$(docker ps -q -f name=devops-python-api)" ]; then
              echo "Deploy concluído e contêiner rodando!"
            else
              echo "Falha: O contêiner não subiu corretamente."
              docker logs devops-python-api
              exit 1
            fi
